databaseChangeLog:
  - changeSet:
      id: 001-create-users
      author: artstar
      changes:
        - createTable:
            tableName: users
            columns:
              - column:
                    name: keycloak_id
                    type: uuid
                    constraints:
                      nullable: false
                      unique: true
              - column:
                  name: id
                  type: UUID
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: created_at
                  type: TIMESTAMP WITH TIME ZONE
                  constraints:
                    nullable: false
              - column:
                  name: updated_at
                  type: TIMESTAMP WITH TIME ZONE
                  constraints:
                    nullable: false
              - column:
                  name: removed
                  type: BOOLEAN
                  defaultValueBoolean: false
                  constraints:
                    nullable: false
              - column:
                  name: first_name
                  type: VARCHAR(128)
                  constraints:
                    nullable: false
              - column:
                  name: last_name
                  type: VARCHAR(128)
                  constraints:
                    nullable: false
              - column:
                  name: role
                  type: VARCHAR(32)
                  constraints:
                    nullable: false
              - column:
                  name: active
                  type: BOOLEAN
                  constraints:
                    nullable: false
              - column:
                  name: employee_id
                  type: VARCHAR(64)
              - column:
                  name: warehouse_id
                  type: VARCHAR(64)
        - addUniqueConstraint:
            tableName: users
            columnNames: employee_id
            constraintName: uk_users_employee_id
        - addUniqueConstraint:
            tableName: users
            columnNames: warehouse_id
            constraintName: uk_users_warehouse_id
